<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 30px; overflow: hidden; background: transparent; user-select: none;
    font: 12px "Microsoft YaHei UI", "PingFang SC", sans-serif; color: #333; }
  /* 磨玻璃：半透明的白色玻璃 + 顶部高光 + 底部细线；窗口底层的系统亚克力材质负责把后面的桌面模糊 */
  .bar { display: flex; align-items: center; height: 30px; padding: 0 4px; gap: 1px; cursor: default;
    background: linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(246,248,252,.46) 100%);
    backdrop-filter: blur(18px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -1px 0 rgba(0,0,0,.08), 0 1px 6px rgba(0,0,0,.08);
    transition: background .2s; }
  /* 透明书页时没有系统模糊，玻璃稍微加厚一点，保证按钮看得清 */
  body.clear .bar { background: linear-gradient(180deg, rgba(255,255,255,.80) 0%, rgba(244,246,250,.70) 100%); }
  .title { flex: 0 1 auto; min-width: 0; padding: 0 6px; color: #1b88ee; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  button { height: 24px; min-width: 24px; padding: 0 3px; border: 0; border-radius: 5px; background: transparent;
    color: #555; cursor: pointer; display: grid; place-items: center; font: inherit; flex-shrink: 0; }
  button:hover { background: rgba(255,255,255,.55); }
  button:disabled { opacity: .35; cursor: default; background: transparent; }
  button.on { background: rgba(219,234,254,.85); color: #1b6fd8; }
  button.close:hover { background: #ef4444; color: #fff; }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .group { display: flex; align-items: center; background: rgba(255,255,255,.38); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); border-radius: 6px; padding: 1px; margin: 0 2px; flex-shrink: 0; }
  .group button:hover { background: rgba(255,255,255,.7); }
  .aa-s { font-size: 11px; font-weight: 700; }
  .aa-l { font-size: 15px; font-weight: 700; }
  #zv { min-width: 38px; font-size: 11px; color: #1b6fd8; }
  #tone { min-width: 40px; font-size: 11px; }
  #auto { display: flex; gap: 3px; padding: 0 5px; font-size: 11px; min-width: 26px; }
  #auto.on { background: #22a55b; color: #fff; }
  #auto.on.paused { background: #f59e0b; }
  #auto.on:hover { filter: brightness(1.08); }
  #autoMore { min-width: 14px; width: 14px; padding: 0; }
  #autoMore svg { width: 11px; height: 11px; }
  .title.flash { color: #22a55b; }
  input[type=range] { width: 56px; height: 4px; accent-color: #1b88ee; margin: 0 3px; flex-shrink: 0; }
  .sep { width: 1px; height: 16px; background: rgba(0,0,0,.12); margin: 0 2px; flex-shrink: 0; }
  /* 拖动把手 + 书名区域始终保留，窗口变窄时先收起次要按钮 */
  .grip { width: 14px; height: 24px; flex-shrink: 0; display: grid; place-items: center; cursor: move; color: #9aa4b2; }
  .grip svg { width: 10px; height: 16px; fill: currentColor; stroke: none; }
  .title { min-width: 0; cursor: move; }
  .bar:hover .grip { color: #1b88ee; }
  /* 窗口变窄时按常用程度动态收起按钮（见下方脚本），收起的功能放进“⋯ 更多”菜单 */
  /* 书名后面的阅读进度：当前页 / 本章总页数 */
  #prog { flex-shrink: 0; padding: 0 6px 0 0; margin-left: -2px; font-size: 11px; font-weight: 600; color: #374151;
    font-variant-numeric: tabular-nums; white-space: nowrap; cursor: move; }
  #prog:empty { display: none; }
  /* 进度后面的空白区：占满剩余宽度，也可以按住拖动窗口 */
  /* 书名 + 页数：和右侧按钮组一样的玻璃块 */
  .tblock { display: flex; align-items: center; flex: 0 1 auto; min-width: 0; height: 24px; margin: 0 2px;
    background: rgba(255,255,255,.38); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); border-radius: 6px; cursor: move; }
  .tblock .title { padding: 0 8px; font-size: 12px; line-height: 24px; }
  .tblock #prog { margin: 0; padding: 0 8px; height: 16px; line-height: 16px; border-left: 1px solid rgba(0,0,0,.12);
    color: #4b5563; font-weight: 600; }
  .spacer { flex: 1 1 0; min-width: 0; align-self: stretch; cursor: move; }
  #more { display: none; font-size: 15px; font-weight: 700; letter-spacing: -1px; }
</style>
</head>
<body>
<div class="bar">
  <div class="grip" title="按住拖动窗口（也可在窗口任意位置按住 Alt 拖动）"><svg viewBox="0 0 10 16"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg></div>
  <button id="back" title="后退 (Alt+←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="home" title="返回书架"><svg viewBox="0 0 24 24"><path d="M4 19V5a1 1 0 0 1 1-1h3v15M8 4h3v15M14 6l3-1 4 13-3 1z"/><path d="M3 20h18"/></svg></button>
  <button id="reload" title="刷新 (F5)"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <div class="tblock" id="tblock">
    <div class="title" id="title" title="按住拖动窗口">微信读书</div>
    <span id="prog" title="当前页 / 本章总页数"></span>
  </div>
  <div class="spacer"></div>

  <div class="group zoom" title="字体大小：Ctrl + 加号/减号，Ctrl + 滚轮，Ctrl+0 恢复">
    <button id="zoomOut" class="aa-s" title="字体缩小 (Ctrl -)">A−</button>
    <button id="zv" title="点击恢复 100% (Ctrl+0)">100%</button>
    <button id="zoomIn" class="aa-l" title="字体放大 (Ctrl +)">A+</button>
  </div>
  <div class="group" id="autoGroup" title="自动翻页：点击开/停 (Alt+P)；鼠标滚轮调快慢 (Alt+[ / Alt+])；右侧小箭头更多设置">
    <button id="auto"><svg viewBox="0 0 24 24" id="autoIcon"><path d="M7 4l12 8-12 8z"/></svg><span id="autoText"></span></button>
    <button id="autoMore" title="自动翻页设置"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <button id="ticker" title="播报条：单行向左滚动，像新闻播报条 (Alt+L)"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="2"/><path d="M6 12h7M16 12h2"/><path d="M19 5l2 -2M19 19l2 2" /></svg></button>
  <button id="tone" title="切换阅读色调 (Ctrl+T)：原色 / 护眼 / 豆沙绿 / 夜间">原色</button>
  <div class="sep o"></div>
  <input id="op" type="range" min="20" max="100" step="5" title="窗口不透明度 (Alt+↑/↓)">
  <button id="fade" title="鼠标移开自动隐身（完全透明且不挡鼠标；托盘菜单可调隐身程度）"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button id="pin" title="窗口置顶"><svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg></button>
  <button id="immersive" title="沉浸模式 (Ctrl+H)：工具栏自动隐藏，鼠标移到窗口顶部即出现"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="more" title="更多功能（窗口太窄时收起的按钮在这里）">⋯</button>
  <button id="min" title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="close" class="close" title="隐藏到托盘 (Alt+Q 唤出)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  ['back', 'home', 'reload', 'fade', 'pin', 'immersive', 'min', 'close', 'zoomIn', 'zoomOut', 'tone', 'ticker'].forEach(id =>
    $(id).addEventListener('click', () => window.api.cmd(id)));
  $('zv').addEventListener('click', () => window.api.cmd('zoomReset'));
  $('auto').addEventListener('click', () => window.api.cmd('auto'));
  $('autoMore').addEventListener('click', () => window.api.cmd('autoMenu'));
  $('auto').addEventListener('contextmenu', (e) => { e.preventDefault(); window.api.cmd('autoMenu'); });
  $('auto').addEventListener('wheel', (e) => {        // 在按钮上滚轮调快慢
    if (e.ctrlKey) return;
    e.preventDefault(); e.stopPropagation();
    window.api.cmd(e.deltaY < 0 ? 'autoFaster' : 'autoSlower');
  }, { passive: false });
  const PLAY = '<path d="M7 4l12 8-12 8z"/>', PAUSE = '<path d="M8 5v14M16 5v14"/>';
  window.api.onAuto((a) => {
    $('auto').classList.toggle('on', a.on);
    $('auto').classList.toggle('paused', a.on && a.paused);
    $('autoIcon').innerHTML = a.on ? PAUSE : PLAY;
    $('autoText').textContent = a.text;
    $('auto').title = a.on
      ? (a.mode === 'page' ? `自动翻页中：${a.text} 后翻下一页（点击停止）` : `自动滚动中：${a.text} 像素/秒（点击停止）`)
      : '开始自动翻页 (Alt+P)';
  });
  let flashT = null, curTitle = '微信读书';
  window.api.onFlash((msg) => {
    clearTimeout(flashT);
    $('title').textContent = msg; $('title').classList.add('flash');
    flashT = setTimeout(() => { $('title').textContent = curTitle; $('title').classList.remove('flash'); }, 1500);
  });
  $('op').addEventListener('input', (e) => window.api.cmd('opacity', e.target.value / 100));
  window.addEventListener('wheel', (e) => {           // 在工具栏上 Ctrl+滚轮 也能调字号
    if (e.ctrlKey) { e.preventDefault(); window.api.cmd(e.deltaY < 0 ? 'zoomIn' : 'zoomOut'); }
  }, { passive: false });
  // 拖动窗口：按住工具栏任意空白处（含书名）拖动
  const barEl = document.querySelector('.bar');
  let dragging = false;
  barEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('button, input')) return;
    e.preventDefault();
    barEl.setPointerCapture(e.pointerId);
    dragging = true; window.api.drag('start');
  });
  barEl.addEventListener('pointermove', () => { if (dragging) window.api.drag('move'); });
  const endDrag = () => { if (dragging) { dragging = false; window.api.drag('end'); } };
  barEl.addEventListener('pointerup', endDrag);
  barEl.addEventListener('lostpointercapture', endDrag);
  if (/Mac/.test(navigator.platform)) {
    document.querySelectorAll('[title]').forEach((el) => {
      el.title = el.title.replace(/Ctrl\s*\+\s*/g, '⌘').replace(/Ctrl/g, '⌘').replace(/Alt\s*\+\s*/g, '⌥').replace(/Alt/g, '⌥');
    });
  }
  window.api.onGlass((g) => document.body.classList.toggle('clear', !!g.clear));
  // ---------- 按常用程度收起按钮 ----------
  // 数字越小越不常用，窗口变窄时越先收起；拖动把手、书名、关闭永远显示
  const PRIORITY = [
    ['op', 10],          // 透明度滑块（有 Alt+↑/↓）
    ['reload', 15],      // 刷新（有 F5）
    ['min', 20],         // 最小化（和关闭一样都是收到托盘）
    ['zv', 30],          // 字号百分比
    ['back', 35],        // 后退
    ['autoMore', 40],    // 自动翻页设置 ▾
    ['home', 45],        // 书架（书页左下角另有按钮）
    ['pin', 50],         // 置顶（一般设一次）
    ['tone', 55],        // 色调
    ['zoomGroup', 65],   // 字号 A− A+
    ['immersive', 70],   // 沉浸模式
    ['ticker', 80],      // 播报条
    ['autoGroup', 85],   // 自动翻页 ▶
    ['fade', 90],        // 鼠标移开隐身
    ['prog', 95],        // 阅读进度（最后才收起）
  ];
  const elOf = (id) => id === 'zoomGroup' ? document.querySelector('.group.zoom') : $(id);
  let hiddenIds = [];
  function fitBar() {
    const bar = document.querySelector('.bar'), title = $('title');
    PRIORITY.forEach(([id]) => { elOf(id).style.display = ''; });
    document.querySelector('.sep.o').style.display = '';
    $('more').style.display = 'none';
    hiddenIds = [];
    const crowded = () => bar.scrollWidth > bar.clientWidth + 1 || (title.scrollWidth > title.clientWidth + 1 && title.clientWidth < 56);
    for (const [id] of PRIORITY) {
      if (!crowded()) break;
      if (!hiddenIds.length) $('more').style.display = 'grid';   // 先腾出“⋯”的位置
      elOf(id).style.display = 'none';
      if (id === 'op') document.querySelector('.sep.o').style.display = 'none';
      hiddenIds.push(id);
    }
  }
  window.addEventListener('resize', fitBar);
  $('more').addEventListener('click', () => window.api.cmd('more', hiddenIds));
  setTimeout(fitBar, 0);

  window.api.onProg((t) => { $('prog').textContent = t; fitBar(); });
  window.api.onState((s) => {
    $('pin').classList.toggle('on', s.onTop);
    $('fade').classList.toggle('on', s.fade);
    $('immersive').classList.toggle('on', s.immersive);
    $('tone').classList.toggle('on', s.tone !== 'none');
    $('tone').textContent = s.toneLabel;
    $('zv').textContent = Math.round(s.zoom * 100) + '%';
    $('zoomIn').disabled = s.zoom >= 3;
    $('zoomOut').disabled = s.zoom <= 0.6;
    $('back').disabled = !s.canBack;
    curTitle = s.title;
    if (!flashT || !$('title').classList.contains('flash')) $('title').textContent = s.title;
    $('title').title = s.title;
    if (document.activeElement !== $('op')) $('op').value = Math.round(s.opacity * 100);
    fitBar();
  });
</script>
</body>
</html>
