<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>请作者喝瓶水</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 窗口本身带系统毛玻璃（Win11）；这里再叠一层深色半透明，没有毛玻璃的系统上就是深色底 */
  html, body { height: 100%; overflow: hidden; user-select: none; color: #e6eaf0;
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  body { background: linear-gradient(170deg, rgba(34,40,52,.72) 0%, rgba(20,23,30,.80) 100%);
    -webkit-app-region: drag; text-align: center; padding: 18px 22px 14px; position: relative; }
  body::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }

  .close { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 6px; border: 0;
    background: transparent; color: rgba(230,234,240,.55); font-size: 13px; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(255,255,255,.10); color: #fff; }

  /* 图标：微信读书同款蓝色渐变圆角方块 + 白色水滴 */
  .logo { width: 40px; height: 40px; margin: 2px auto 0; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(150deg, #5cb0ff 0%, #2a7cf0 55%, #1c5fd6 100%);
    box-shadow: 0 4px 14px rgba(42,124,240,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  h1 { font-size: 16px; font-weight: 600; margin-top: 10px; letter-spacing: .5px; }
  .sub { font-size: 12px; color: rgba(230,234,240,.62); line-height: 1.7; margin-top: 4px; }

  .tabs { display: inline-flex; margin-top: 12px; padding: 3px; border-radius: 8px;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); -webkit-app-region: no-drag; }
  .tab { border: 0; border-radius: 6px; padding: 4px 16px; font-size: 12px; cursor: pointer; font-family: inherit;
    background: transparent; color: rgba(230,234,240,.6); transition: background .15s, color .15s; }
  .tab:hover { color: #fff; }
  .tab.on { background: linear-gradient(150deg, #4da6ff, #2a7cf0); color: #fff; box-shadow: 0 1px 6px rgba(42,124,240,.4); }

  .qr { width: 164px; height: 164px; margin: 12px auto 0; border-radius: 12px; background: #fff; padding: 8px;
    display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35); -webkit-app-region: no-drag; }
  .qr img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .qr .none { font-size: 12px; color: #8a94a3; line-height: 1.7; }
  .hint { font-size: 11px; color: rgba(230,234,240,.45); margin-top: 8px; min-height: 15px; }

  .ok { margin-top: 10px; border: 0; border-radius: 8px; padding: 6px 20px; font-size: 12px; cursor: pointer;
    font-family: inherit; color: #cfe3ff; background: rgba(42,124,240,.18); box-shadow: inset 0 0 0 1px rgba(77,166,255,.35);
    -webkit-app-region: no-drag; transition: background .15s, color .15s; }
  .ok:hover { background: rgba(42,124,240,.32); color: #fff; }
  .foot { font-size: 11px; color: rgba(230,234,240,.38); margin-top: 8px; }

  .xhs { display: inline-block; margin-top: 10px; font-size: 11px; color: rgba(140,190,255,.75); text-decoration: none;
    -webkit-app-region: no-drag; cursor: pointer; }
  .xhs:hover { color: #8cc4ff; text-decoration: underline; }
  .done { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(170deg, rgba(34,40,52,.92), rgba(20,23,30,.95)); }
  .done.show { display: flex; animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .done p { font-size: 15px; font-weight: 600; }
  .done small { font-size: 12px; color: rgba(230,234,240,.55); }
</style>
</head>
<body>
  <button class="close" id="close" title="关闭（Esc）">✕</button>
  <div class="logo">
    <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true">
      <path d="M10 1.5 C10 1.5 2.5 9.6 2.5 14 a7.5 7.5 0 0 0 15 0 C17.5 9.6 10 1.5 10 1.5 Z" fill="#fff"/>
      <path d="M6.2 14.2 a3.8 3.8 0 0 0 3 3.6" stroke="#2a7cf0" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".55"/>
    </svg>
  </div>
  <h1>请作者喝瓶水</h1>
  <div class="sub">小窗制作不易，觉得好用的话，<br>可以请作者喝瓶水。</div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-k="wx">微信</button>
    <button class="tab" data-k="ali">支付宝</button>
  </div>
  <div class="qr" id="qr"><div class="none">暂未设置收款码</div></div>
  <div class="hint" id="hint"></div>

  <button class="ok" id="ok">已支持</button>
  <a class="xhs" id="xhs" href="#" title="在浏览器中打开">反馈与新版本：小红书 @东尼滝谷 ›</a>

  <div class="done" id="done">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="16" fill="rgba(42,124,240,.22)" stroke="#4da6ff" stroke-width="1.5"/>
      <path d="M10.5 17.5 l4.5 4.5 l8.5 -9" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <p>谢谢支持</p>
    <small>会继续把小窗做得更好用</small>
  </div>
<script>
  let codes = { wx: '', ali: '' };
  const $ = (id) => document.getElementById(id);
  const HINT = { wx: '打开微信扫一扫', ali: '打开支付宝扫一扫' };
  function show(k) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.k === k));
    $('qr').innerHTML = codes[k] ? `<img src="${codes[k]}" alt="">` : '<div class="none">暂未设置收款码</div>';
    $('hint').textContent = codes[k] ? HINT[k] : '';
  }
  // 主进程注入收款码（data URL）；只有一种码时隐藏切换按钮
  let xhs = '';
  window.setCodes = (c) => {
    xhs = c.xhs || ''; $('xhs').style.display = xhs ? '' : 'none';
    codes = { wx: c.wx || '', ali: c.ali || '' };
    $('tabs').style.display = (codes.wx && codes.ali) || (!codes.wx && !codes.ali) ? '' : 'none';
    show(codes.wx || !codes.ali ? 'wx' : 'ali');
  };
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.k)));
  $('xhs').addEventListener('click', (e) => { e.preventDefault(); if (xhs) window.open(xhs); });
  $('close').addEventListener('click', () => window.close());
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  $('ok').addEventListener('click', () => { $('done').classList.add('show'); setTimeout(() => window.close(), 1600); });
</script>
</body>
</html>
