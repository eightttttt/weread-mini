<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>请作者喝瓶水</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow: hidden; user-select: none; color: #1f2937;
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  /* 和小窗一样的圆角卡片（圆角 8px），颜色与工具栏一致。
     背景必须画在单独的 .card 上：画在 body 上会被浏览器提升去铺满整个窗口，圆角就失效了 */
  html, body { background: transparent !important; margin: 0; }
  .card { background: linear-gradient(180deg, rgba(251,252,253,.97) 0%, rgba(241,243,246,.97) 100%);
    border-radius: 8px; overflow: hidden; -webkit-app-region: drag; text-align: center;
    padding: 20px 22px 18px; position: relative; min-height: 100vh; }
  .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(0,0,0,.10); }

  .close { position: absolute; top: 9px; right: 9px; width: 24px; height: 24px; border-radius: 6px; border: 0;
    background: transparent; color: #9aa3af; font-size: 13px; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(0,0,0,.06); color: #374151; }

  /* 图标：微信读书同款蓝色渐变圆角方块 + 白色水滴 */
  .logo { width: 38px; height: 38px; margin: 0 auto; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(150deg, #5cb0ff 0%, #2a7cf0 55%, #1c5fd6 100%);
    box-shadow: 0 4px 12px rgba(42,124,240,.30), inset 0 1px 0 rgba(255,255,255,.35); }
  h1 { font-size: 16px; font-weight: 600; margin-top: 10px; letter-spacing: .5px; color: #111827; }
  .sub { font-size: 12px; color: #6b7280; line-height: 1.7; margin-top: 4px; }

  .tabs { display: inline-flex; margin-top: 14px; padding: 3px; border-radius: 8px;
    background: rgba(0,0,0,.05); box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); -webkit-app-region: no-drag; }
  .tab { border: 0; border-radius: 6px; padding: 4px 18px; font-size: 12px; cursor: pointer; font-family: inherit;
    background: transparent; color: #6b7280; transition: background .15s, color .15s; }
  .tab:hover { color: #111827; }
  .tab.on { background: linear-gradient(150deg, #4da6ff, #2a7cf0); color: #fff; box-shadow: 0 1px 5px rgba(42,124,240,.35); }

  .qr { width: 160px; height: 160px; margin: 12px auto 0; border-radius: 12px; background: #fff; padding: 8px;
    display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 4px 14px rgba(15,23,42,.10); -webkit-app-region: no-drag; }
  .qr img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .qr .none { font-size: 12px; color: #8a94a3; line-height: 1.7; }
  .hint { font-size: 11px; color: #9aa3af; margin-top: 8px; min-height: 15px; }

  .ok { margin-top: 10px; border: 0; border-radius: 8px; padding: 6px 22px; font-size: 12px; cursor: pointer;
    font-family: inherit; color: #1d6fe8; background: rgba(42,124,240,.10); box-shadow: inset 0 0 0 1px rgba(42,124,240,.28);
    -webkit-app-region: no-drag; transition: background .15s, color .15s; }
  .ok:hover { background: rgba(42,124,240,.18); }

  /* 底部：细分隔线 + 反馈入口 */
  .fb { margin: 16px -22px 0; padding-top: 12px; border-top: 1px solid rgba(0,0,0,.07); -webkit-app-region: no-drag; }
  .fbt { font-size: 11px; color: #9aa3af; }
  .xhs { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; color: #374151;
    text-decoration: none; cursor: pointer; }
  .xhs:hover { color: #1d6fe8; }
  .xi { width: 16px; height: 16px; display: inline-grid; place-items: center; }
  .xi svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
  .xi img { width: 16px; height: 16px; border-radius: 4px; display: block; }
  /* 文字框裁到“字顶到基线”，再和图标居中对齐：不同字体（微软雅黑字形偏下）下都在同一条水平中线上 */
  .xn { display: block; line-height: 1; text-box: trim-both cap alphabetic; }

  .done { position: absolute; inset: 0; border-radius: 8px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(244,246,250,.96)); }
  .done.show { display: flex; animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .done p { font-size: 15px; font-weight: 600; color: #111827; }
  .done small { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<div class="card" id="card">
  <button class="close" id="close" title="关闭（Esc）">✕</button>
  <div class="logo">
    <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true">
      <path d="M10 1.5 C10 1.5 2.5 9.6 2.5 14 a7.5 7.5 0 0 0 15 0 C17.5 9.6 10 1.5 10 1.5 Z" fill="#fff"/>
      <path d="M6.2 14.2 a3.8 3.8 0 0 0 3 3.6" stroke="#2a7cf0" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".55"/>
    </svg>
  </div>
  <h1>请作者喝瓶水</h1>
  <div class="sub">小窗制作不易，觉得好用的话，<br>可以请作者喝瓶水。</div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-k="wx">微信</button>
    <button class="tab" data-k="ali">支付宝</button>
  </div>
  <div class="qr" id="qr"><div class="none">暂未设置收款码</div></div>
  <div class="hint" id="hint"></div>

  <button class="ok" id="ok">已支持</button>
  <div class="fb" id="fb">
    <div class="fbt">反馈与新版本</div>
    <a class="xhs" id="xhs" href="#" title="在浏览器中打开小红书主页"><span class="xi" id="xi"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H7.2L4.5 13.6v-2.1H3A1.5 1.5 0 0 1 1.5 10V5A1.5 1.5 0 0 1 3 3.5z"/></svg></span><span class="xn">@东尼滝谷 ›</span></a>
  </div>

  <div class="done" id="done">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="16" fill="#2a7cf0"/>
      <path d="M10.5 17.5 l4.5 4.5 l8.5 -9" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <p>谢谢支持</p>
    <small>会继续把小窗做得更好用</small>
  </div>
</div>
<script>
  window.contentHeight = () => {               // 内容本身的高度（不算撑满窗口的部分）
    const c = document.getElementById('card'); c.style.minHeight = '0'; const h = Math.ceil(c.scrollHeight); c.style.minHeight = ''; return h;
  };
  let codes = { wx: '', ali: '' };
  const $ = (id) => document.getElementById(id);
  const HINT = { wx: '打开微信扫一扫', ali: '打开支付宝扫一扫' };
  function show(k) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.k === k));
    $('qr').innerHTML = codes[k] ? `<img src="${codes[k]}" alt="">` : '<div class="none">暂未设置收款码</div>';
    $('hint').textContent = codes[k] ? HINT[k] : '';
  }
  // 主进程注入收款码（data URL）；只有一种码时隐藏切换按钮
  let xhs = '';
  window.setCodes = (c) => {
    xhs = c.xhs || ''; $('fb').style.display = xhs ? '' : 'none';
    if (c.xhsIcon) $('xi').innerHTML = `<img src="${c.xhsIcon}" alt="">`;   // 有图标文件时换成图标
    codes = { wx: c.wx || '', ali: c.ali || '' };
    $('tabs').style.display = (codes.wx && codes.ali) || (!codes.wx && !codes.ali) ? '' : 'none';
    show(codes.wx || !codes.ali ? 'wx' : 'ali');
  };
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.k)));
  $('xhs').addEventListener('click', (e) => { e.preventDefault(); if (xhs) window.open(xhs); });
  $('close').addEventListener('click', () => window.close());
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  $('ok').addEventListener('click', () => { $('done').classList.add('show'); setTimeout(() => window.close(), 1600); });
</script>
</body>
</html>
