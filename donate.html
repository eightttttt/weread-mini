<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>请作者喝瓶水</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none;
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  .card {
    position: absolute; inset: 8px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(165deg, #e6f7ff 0%, #f1fbf6 45%, #fff3ec 100%);
    box-shadow: 0 6px 22px rgba(60, 90, 120, .28), inset 0 0 0 1px rgba(255,255,255,.9);
    -webkit-app-region: drag; text-align: center; padding: 14px 18px 12px;
  }
  .close { position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.75); color: #7a8a99; font-size: 15px; cursor: pointer;
    -webkit-app-region: no-drag; transition: transform .15s, background .15s; }
  .close:hover { background: #ffe1e1; color: #e0607e; transform: rotate(90deg); }

  /* 小水瓶 */
  .mascot { width: 60px; height: 76px; margin: 0 auto; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
  .eye { animation: blink 4s infinite; transform-origin: center 47px; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .drop { position: absolute; font-size: 13px; opacity: 0; animation: fall 3s ease-in infinite; }
  .drop.d1 { left: 30%; top: 22px; } .drop.d2 { left: 68%; top: 30px; animation-delay: 1.1s; } .drop.d3 { left: 22%; top: 70px; animation-delay: 2s; }
  @keyframes fall { 0% { opacity: 0; transform: translateY(-6px) scale(.7); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(22px) scale(1); } }

  h1 { font-size: 17px; color: #3b6e8f; margin-top: 4px; letter-spacing: .5px; }
  .sub { font-size: 12px; color: #6b7f8e; line-height: 1.6; margin-top: 4px; }
  .sub b { color: #ff7a93; }

  .tabs { display: inline-flex; gap: 4px; margin-top: 8px; padding: 3px; border-radius: 999px;
    background: rgba(255,255,255,.7); -webkit-app-region: no-drag; }
  .tab { border: 0; border-radius: 999px; padding: 4px 14px; font-size: 12px; cursor: pointer;
    background: transparent; color: #6b7f8e; font-family: inherit; transition: all .15s; }
  .tab.on.wx { background: #2fc26b; color: #fff; }
  .tab.on.ali { background: #1677ff; color: #fff; }

  .qr { width: 156px; height: 156px; margin: 8px auto 0; border-radius: 16px; background: #fff;
    border: 2px dashed #b9dcef; display: grid; place-items: center; overflow: hidden; -webkit-app-region: no-drag; }
  .qr img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
  .qr .none { font-size: 12px; color: #9aaab6; line-height: 1.7; padding: 10px; }

  .thanks { margin-top: 10px; border: 0; border-radius: 999px; padding: 6px 18px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; color: #fff; background: linear-gradient(90deg, #ff9db0, #ffb877);
    box-shadow: 0 3px 10px rgba(255,140,150,.35); -webkit-app-region: no-drag; transition: transform .15s; }
  .thanks:hover { transform: translateY(-1px) scale(1.04); }
  .foot { font-size: 11px; color: #a3b1bc; margin-top: 6px; }

  /* 点了“已经请啦”之后 */
  .done { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(165deg, #fff0f4, #fff8ec); gap: 8px; }
  .done.show { display: flex; animation: pop .35s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  .done .big { font-size: 44px; animation: bob 1.6s ease-in-out infinite; }
  .done p { font-size: 15px; color: #e0607e; font-weight: 600; }
  .done small { font-size: 12px; color: #b08a96; }
  .heart { position: absolute; bottom: -20px; font-size: 16px; animation: rise 1.8s ease-out forwards; }
  @keyframes rise { to { transform: translateY(-360px) rotate(20deg); opacity: 0; } }
</style>
</head>
<body>
<div class="card">
  <button class="close" id="close" title="关闭">✕</button>
  <span class="drop d1">💧</span><span class="drop d2">💧</span><span class="drop d3">💧</span>

  <svg class="mascot" viewBox="0 0 76 96" aria-hidden="true">
    <rect x="28" y="2" width="20" height="11" rx="4" fill="#7cc4ea"/>
    <rect x="31" y="11" width="14" height="7" rx="2" fill="#bfe6f7"/>
    <path d="M24 20 Q38 14 52 20 L58 32 Q62 38 62 46 L62 82 Q62 92 52 92 L24 92 Q14 92 14 82 L14 46 Q14 38 18 32 Z"
          fill="#d9f2fd" stroke="#8fd0ee" stroke-width="2"/>
    <path d="M16 56 Q38 50 60 56 L60 82 Q60 90 52 90 L24 90 Q16 90 16 82 Z" fill="#9fdcf6" opacity=".8"/>
    <path d="M22 34 Q20 44 21 52" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9"/>
    <g class="eye"><ellipse cx="30" cy="47" rx="3" ry="3.6" fill="#35546b"/><ellipse cx="46" cy="47" rx="3" ry="3.6" fill="#35546b"/></g>
    <circle cx="31" cy="45.8" r="1" fill="#fff"/><circle cx="47" cy="45.8" r="1" fill="#fff"/>
    <ellipse cx="24.5" cy="54" rx="4" ry="2.4" fill="#ffadc0" opacity=".85"/>
    <ellipse cx="51.5" cy="54" rx="4" ry="2.4" fill="#ffadc0" opacity=".85"/>
    <path d="M34 54 Q38 58 42 54" stroke="#35546b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>

  <h1>请作者喝瓶水吧～</h1>
  <div class="sub">小窗是作者下班后一点点敲出来的<br>觉得好用的话，<b>2 块钱</b>就能让作者开心一整天 ✧</div>

  <div class="tabs">
    <button class="tab wx on" data-k="wx">微信</button>
    <button class="tab ali" data-k="ali">支付宝</button>
  </div>
  <div class="qr" id="qr"><div class="none">收款码还在路上～<br>先谢谢你的心意啦 ♡</div></div>

  <button class="thanks" id="thanks">我已经请啦 🥤</button>
  <div class="foot">完全自愿，不请也能一直免费用哦 ♡</div>

  <div class="done" id="done">
    <div class="big">🥰</div>
    <p>谢谢你！咕嘟咕嘟～</p>
    <small>作者喝饱了，会继续努力更新的！</small>
  </div>
</div>
<script>
  let codes = { wx: '', ali: '' }, cur = 'wx';
  const $ = (id) => document.getElementById(id);
  function show(k) {
    cur = k;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.k === k));
    $('qr').innerHTML = codes[k]
      ? `<img src="${codes[k]}" alt="">`
      : '<div class="none">收款码还在路上～<br>先谢谢你的心意啦 ♡</div>';
  }
  // 主进程注入收款码（data URL）；只有一种码时隐藏切换按钮
  window.setCodes = (c) => {
    codes = { wx: c.wx || '', ali: c.ali || '' };
    const both = codes.wx && codes.ali;
    document.querySelector('.tabs').style.display = both || (!codes.wx && !codes.ali) ? '' : 'none';
    show(codes.wx || !codes.ali ? 'wx' : 'ali');
  };
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.k)));
  $('close').addEventListener('click', () => window.close());
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  $('thanks').addEventListener('click', () => {
    $('done').classList.add('show');
    for (let i = 0; i < 14; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = ['💗', '💧', '✨', '💕'][i % 4];
      h.style.left = (8 + Math.random() * 84) + '%';
      h.style.animationDelay = (Math.random() * 0.6) + 's';
      $('done').appendChild(h);
    }
    setTimeout(() => window.close(), 2600);
  });
</script>
</body>
</html>
