<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  /* 播报条：深色磨玻璃底 + 浅色文字；“透明”色调时只留文字 */
  #strip { position: absolute; inset: 0; overflow: hidden; cursor: grab; border-radius: 8px;
    background: linear-gradient(180deg, rgba(36,37,40,.88), rgba(24,25,28,.92));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.06); }
  body.clear #strip { background: transparent; box-shadow: none; }
  #strip.dragging { cursor: grabbing; }
  /* 文字占满整条播报条 */
  #clip { position: absolute; top: 0; bottom: 0; right: 0; left: 18px; overflow: hidden; }
  #track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; white-space: nowrap;
    will-change: transform; color: #ececec; font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; }
  body.clear #track { color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000, 0 1px 2px rgba(0,0,0,.9); }
  .seg { padding-right: 0; }      /* 页与页之间文字是连着的（常常一句话跨两页），不加间隔 */
  /* 两端渐隐，像新闻播报条 */
  #fadeL, #fadeR { position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; z-index: 2; }
  #fadeL { left: 0; background: linear-gradient(90deg, rgba(26,27,30,.95), rgba(26,27,30,0)); }
  #fadeR { right: 0; background: linear-gradient(270deg, rgba(26,27,30,.95), rgba(26,27,30,0)); border-radius: 0 8px 8px 0; }
  body.clear #fadeL, body.clear #fadeR { display: none; }
  #tip { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 3; padding: 2px 10px; border-radius: 10px;
    background: rgba(27,136,238,.92); color: #fff; font: 12px "Microsoft YaHei UI", "PingFang SC", sans-serif; opacity: 0;
    transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #tip.show { opacity: 1; }
  /* 左侧控制按钮：暂停 / 继续、字号 A− / A+、背景切换、加速 / 减速。平时隐藏，鼠标移到播报条上才出现 */
  #ctl { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); z-index: 5; display: flex; gap: 2px;
    padding: 2px; border-radius: 8px; background: rgba(20,20,22,.55); transition: opacity .15s, background .15s; }
  /* 左侧功能区：平时只有一个很淡的小标记，鼠标移到这块区域才出现按钮，叠在文字上方 */
  #ctlzone { position: absolute; left: 0; top: 0; bottom: 0; width: 34px; z-index: 5; }
  #ctl { opacity: 0; pointer-events: none; background: rgba(20,20,22,.9); box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  #ctlzone:hover #ctl { opacity: 1; pointer-events: auto; }
  #hint { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); width: 4px; height: 14px; opacity: .35;
    background: radial-gradient(circle, #fff 1.2px, transparent 1.6px) 0 0 / 4px 5px repeat-y;
    filter: drop-shadow(0 0 1px rgba(0,0,0,.9)); transition: opacity .12s; pointer-events: none; }
  #ctlzone:hover #hint { opacity: 0; }
  #ctl button { width: 24px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: #eee; cursor: pointer;
    display: grid; place-items: center; font: 700 11px "Microsoft YaHei UI", "PingFang SC", sans-serif; padding: 0; }
  #ctl button:hover { background: rgba(255,255,255,.18); }
  #ctl button.big { font-size: 14px; }
  #ctl svg { width: 13px; height: 13px; fill: currentColor; }
  #ctl #pause.paused { background: #1b88ee; }
  #ctl .sep { width: 1px; align-self: stretch; margin: 3px 2px; background: rgba(255,255,255,.2); }
  #ctl .txt { font-size: 11px; width: 26px; }
  /* 最右侧细条：拖动调整播报条宽度 */
  #resize { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 4; }
</style>
</head>
<body>
<div id="strip">
  <div id="clip"><div id="track"></div><div id="fadeL"></div><div id="fadeR"></div></div>
  <div id="ctlzone"><div id="hint"></div>
  <div id="ctl">
    <button id="pause" title="暂停 / 继续 (空格)"><svg id="pauseIcon" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <span class="sep"></span>
    <button id="fminus" title="字号缩小 (Ctrl -)">A−</button>
    <button id="fplus" class="big" title="字号放大 (Ctrl +)">A+</button>
    <button id="bg" title="背景：透明 / 深色"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18V3z"/><path d="M12 3a9 9 0 0 1 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <span class="sep"></span>
    <button id="splus" class="txt" title="加快（Alt+]，或在播报条上向上滚动滚轮）">快</button>
    <button id="sminus" class="txt" title="减慢（Alt+[，或在播报条上向下滚动滚轮）">慢</button>
  </div></div>
  <div id="tip"></div>
  <div id="resize" title="拖动调整宽度"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const strip = $('strip'), track = $('track'), clip = $('clip');
  let speed = 60;          // 像素/秒
  let x = 0;               // 文字条当前位移
  let paused = false, last = performance.now(), asked = false;

  function setFont(px) { track.style.fontSize = px + 'px'; }
  setFont(18);

  function addSeg(text, id) {
    const sp = document.createElement('span');
    sp.className = 'seg'; sp.textContent = text; sp.dataset.id = id;
    track.appendChild(sp);
    asked = false;
  }
  function reset() { track.textContent = ''; x = clip.clientWidth * 0.6; asked = false; }

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused && track.firstChild) x -= speed * dt;
    // 移出左边的段落删掉，并告诉主程序“读到了哪一页”
    let first = track.firstElementChild;
    while (first && x + first.offsetWidth < 0 && track.children.length > 1) {
      x += first.offsetWidth; first.remove();
      window.api.ticker('passed', track.firstElementChild ? +track.firstElementChild.dataset.id : 0);
      first = track.firstElementChild;
    }
    track.style.transform = `translateX(${x}px)`;
    // 剩余文字不到 1.5 个播报条宽时，提前要下一页
    const remain = x + track.scrollWidth - clip.clientWidth;
    if (!asked && remain < clip.clientWidth * 1.5) { asked = true; window.api.ticker('more'); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  let tipT = null;
  function tip(msg) { $('tip').textContent = msg; $('tip').classList.add('show'); clearTimeout(tipT); tipT = setTimeout(() => $('tip').classList.remove('show'), 1200); }

  window.api.onTicker((m) => {
    if (m.type === 'seg') addSeg(m.text, m.id);
    else if (m.type === 'reset') reset();
    else if (m.type === 'speed') { speed = m.speed; if (m.show) tip(`速度 ${speed}`); }
    else if (m.type === 'tip') tip(m.text);
    else if (m.type === 'clear') document.body.classList.toggle('clear', !!m.clear);
    else if (m.type === 'retry') asked = false;
    else if (m.type === 'font') { setFont(m.size); if (m.show) tip(`字号 ${m.size}`); }
  });

  // 暂停 / 继续（按钮或空格）
  const PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>', PLAY = '<path d="M7 4l13 8-13 8z"/>';
  function setPaused(v) {
    paused = v;
    $('pause').classList.toggle('paused', v);
    $('pauseIcon').innerHTML = v ? PLAY : PAUSE;
    $('pause').title = v ? '继续 (空格)' : '暂停 (空格)';
    tip(v ? '已暂停' : '继续播放');
  }
  $('pause').addEventListener('click', () => setPaused(!paused));
  $('fminus').addEventListener('click', () => window.api.ticker('font', -1));
  $('fplus').addEventListener('click', () => window.api.ticker('font', 1));
  $('bg').addEventListener('click', () => window.api.ticker('bg'));
  $('sminus').addEventListener('click', () => window.api.ticker('speed', -1));
  $('splus').addEventListener('click', () => window.api.ticker('speed', 1));
  // 滚轮调速度；Ctrl + 滚轮调字号
  strip.addEventListener('wheel', (e) => {
    e.preventDefault();
    window.api.ticker(e.ctrlKey || e.metaKey ? 'font' : 'speed', e.deltaY < 0 ? 1 : -1);
  }, { passive: false });
  // 双击退出；右键菜单
  strip.addEventListener('dblclick', (e) => { if (!e.target.closest('#ctl button')) window.api.ticker('exit'); });
  strip.addEventListener('contextmenu', (e) => { e.preventDefault(); window.api.ticker('menu'); });
  // 按住拖动：移动窗口；按住最右侧细条：调整宽度
  let mode = null;
  strip.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('#ctl button')) return;
    strip.setPointerCapture(e.pointerId);
    mode = e.target.id === 'resize' ? 'rsz' : 'drag';
    if (mode === 'drag') strip.classList.add('dragging');
    window.api.ticker(mode, 'start');
  });
  strip.addEventListener('pointermove', () => { if (mode) window.api.ticker(mode, 'move'); });
  const end = () => { if (!mode) return; window.api.ticker(mode, 'end'); mode = null; strip.classList.remove('dragging'); };
  strip.addEventListener('pointerup', end);
  strip.addEventListener('lostpointercapture', end);
  window.addEventListener('keydown', (e) => {
    const c = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') window.api.ticker('exit');
    else if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
    else if (c && (e.key === '=' || e.key === '+')) { e.preventDefault(); window.api.ticker('font', 1); }
    else if (c && e.key === '-') { e.preventDefault(); window.api.ticker('font', -1); }
  });
</script>
</body>
</html>
